name = "agent-broker"
main = "src/index.js"
compatibility_date = "2026-10-01"

# No [vars]: NOTION_TOKEN, BROKER_KEY and QUEUE_DB (the Notion queue database
# id) are Worker secrets, set in the dashboard or with `wrangler secret put`.
# Secrets survive every `wrangler deploy`; [vars] would be overwritten.

# KV binding for agent inboxes. Forks: create your own KV namespace and
# replace this id with yours (it is an identifier, not a credential).
[[kv_namespaces]]
binding = "INBOX"
id = "e68348adf3f54bdaa9c55afa39275dcd"

# Watcher: check the Notion queue every 5 minutes and nudge agent inboxes.
[triggers]
crons = ["*/5 * * * *"]
