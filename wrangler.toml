name = "agent-broker"
main = "src/index.js"
compatibility_date = "2026-10-01"

# No [vars]: QUEUE_DB (the Notion Agent Queue database id) is a Worker secret,
# set in the dashboard alongside NOTION_TOKEN and BROKER_KEY, so this public
# repo carries no Notion ids. Secrets survive every `wrangler deploy`.

# KV binding for agent inboxes (namespace `agent-inbox`, created in dashboard).
[[kv_namespaces]]
binding = "INBOX"
id = "e68348adf3f54bdaa9c55afa39275dcd"

# Watcher: check the Notion Agent Queue every 5 minutes, nudge agent inboxes.
[triggers]
crons = ["*/5 * * * *"]
