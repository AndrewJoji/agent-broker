# Syntax-checks every PR; on pushes to main (or manual runs) deploys the
# Worker with wrangler and smoke-tests it.
#
# Repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Workers & Pages overview, right-hand sidebar
#   BROKER_URL             optional; the Worker's base URL, e.g.
#                          https://agent-broker.<subdomain>.workers.dev
#                          Kept as a secret so it is masked in public logs.
#                          If unset, the smoke test is skipped.
#
# Worker secrets (NOTION_TOKEN, BROKER_KEY, QUEUE_DB) live on the Worker and
# survive every deploy. The KV binding and the cron come from wrangler.toml.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check
        run: node --check src/index.js
      - name: Unit tests
        run: node --test test/

  deploy:
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-agent-broker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      # Runs after the deploy, so a failure here is a red check, not a rollback.
      # The 401 check doubles as a canary that BROKER_KEY is still set on the Worker.
      - name: Smoke test
        env:
          BROKER_URL: ${{ secrets.BROKER_URL }}
        run: |
          if [ -z "$BROKER_URL" ]; then
            echo "BROKER_URL secret not set; skipping smoke test"
            exit 0
          fi
          sleep 10
          curl -sSf "$BROKER_URL/health"
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BROKER_URL/inbox/smoke-test")
          test "$code" = "401" || { echo "expected 401 on GET /inbox/smoke-test without key, got $code"; exit 1; }
          # /peek is a single KV get on the pending flag; post/ack paths need the
          # key (not available to CI) and are covered by test/peek.test.mjs.
          curl -sSf "$BROKER_URL/inbox/smoke-test/peek" | grep -q '"count":[01]}' || { echo "unexpected /peek response"; exit 1; }
          echo "peek ok"
